# GEODE Offroad1 gamma: stereo-inertial VIO, common camera/IMU window, no loop closure.
# Images are already rectified by the dataset adapter; no manual FrameStart.
Datasets:
  geode-gamma: [offroad1]
Methods:
  orbslam3_stereo_vi:
    Module: orbslam3
    Parameters:
      mode: stereo-vi
      verbose: 0
      imu_noise_by_dataset: &imu_noise_profiles
        # Published gamma_config.yaml, external Xsens /imu/data.
        # The second gyro_std entry is random walk per its source comment.
        geode-gamma:
          sigma_g_c: 5.1441059541810427e-03
          sigma_a_c: 5.5741025513357766e-03
          sigma_gw_c: 1.0881627554710405e-04
          sigma_aw_c: 1.2078671772058479e-04
    Settings:
      loopClosing: 0
    Evaluation:
      estimate_frame: camera
      camera: rgb_0
  okvis1_stereo_vi:
    Module: okvis1
    Parameters:
      mode: stereo-vi
      verbose: 0
      imu_noise_by_dataset: *imu_noise_profiles
      # Estimator priors/limits retained from the existing three-method recipe.
      imu_overrides:
        sigma_bg: 0.03
        sigma_ba: 0.1
        a_max: 176.0
        g_max: 7.8
        a0: [0.0, 0.0, 0.0]
        tau: 3600.0
    Evaluation:
      estimate_frame: body
  voxel_svio_stereo_vi:
    Module: voxel-svio
    Parameters:
      mode: stereo-vi
      verbose: 0
      imu_noise_by_dataset: *imu_noise_profiles
    Evaluation:
      estimate_frame: body
NumRuns: 1
Evaluation:
  align: SE3
  correct_scale: false
  max_time_difference_s: 0.05
  evaluate_orientation: true
  max_pose_gap_s: 1.0
  rpe_delta_m: 1.0
  rpe_relative_tolerance: 0.1
