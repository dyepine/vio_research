# Настройки для make plan / prepare / download / convert / validate.
# Относительный data_dir считается от папки этого YAML; ~ раскрывается как HOME.
data_dir: ~/datasets/vio_research
max_data_gb: 125
reserve_gb: 15

# true — обрабатывать, false — пропустить. Порядок здесь = порядок обработки.
# Начинаем с одной записи, остальные включаем после её проверки.
sequences:
  grandtour-alb2: true
  grandtour-trim1: false
  botanicgarden-1018-00: false
  botanicgarden-1005-00: false
