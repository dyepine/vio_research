# Report experiment: three stereo-inertial methods on three outdoor sequences.
# Historical table combines saved runs; this recipe creates a NEW run with current fixes.
# GEODE reference orientation convention and limitations: docs/DATASETS.md.
Datasets:
  grandtour-alphasense:
  - kaeb_1
  botanicgarden:
  - '1018_13'
  geode-gamma:
  - offroad1
Methods:
  orbslam3_stereo_vi:
    Module: orbslam3
    Parameters:
      mode: stereo-vi
      verbose: 0
      imu_noise_by_dataset: &imu_noise_profiles
        grandtour-alphasense:
          sigma_g_c: 0.00020202932517334086
          sigma_a_c: 0.0012593921763625943
          sigma_gw_c: 0.000266
          sigma_aw_c: 0.0043
        botanicgarden:
          sigma_g_c: 0.002
          sigma_a_c: 0.01
          sigma_gw_c: 8.0e-05
          sigma_aw_c: 3.0e-05
        geode-gamma:
          sigma_g_c: 0.005144105954181043
          sigma_a_c: 0.0055741025513357766
          sigma_gw_c: 0.00010881627554710405
          sigma_aw_c: 0.00012078671772058479
    Settings:
      loopClosing: 0
    Evaluation:
      estimate_frame: camera
      camera: rgb_0
  okvis1_stereo_vi:
    Module: okvis1
    Parameters:
      mode: stereo-vi
      verbose: 0
      imu_noise_by_dataset: *imu_noise_profiles
      imu_overrides:
        sigma_bg: 0.03
        sigma_ba: 0.1
        a_max: 176.0
        g_max: 7.8
        a0:
        - 0.0
        - 0.0
        - 0.0
        tau: 3600.0
    Evaluation:
      estimate_frame: body
  voxel_svio_stereo_vi:
    Module: voxel-svio
    Parameters:
      mode: stereo-vi
      verbose: 0
      imu_noise_by_dataset: *imu_noise_profiles
    Evaluation:
      estimate_frame: body
NumRuns: 1
Evaluation:
  align: SE3
  correct_scale: false
  max_time_difference_s: 0.05
  evaluate_orientation: true
  max_pose_gap_s: 1.0
  rpe_delta_m: 1.0
  rpe_relative_tolerance: 0.1
Preparation:
  reserve_gb: 15
  max_data_gb: 125
