# Original OKVIS 1.1.3, author's fix/modernise branch. Offline stereo-inertial VIO.
Datasets:
  grandtour-alphasense: [kaeb_1]
  botanicgarden: ['1018_13']
Methods:
  okvis1_stereo_vi:
    Module: okvis1
    Parameters:
      mode: stereo-vi
      verbose: 0
      imu_noise_by_dataset:
        # Same frozen noise profiles as orbslam3_okvis2_no_loop.yaml.
        grandtour-alphasense:
          sigma_g_c: 0.00020202932517334086
          sigma_a_c: 0.0012593921763625943
          sigma_gw_c: 0.0000018672379701877664
          sigma_aw_c: 0.00004317454918100831
        botanicgarden:
          sigma_g_c: 0.002
          sigma_a_c: 0.01
          sigma_gw_c: 0.00008
          sigma_aw_c: 0.00003
      # Stock estimator priors/limits; kept separate from sensor noise densities.
      imu_overrides:
        sigma_bg: 0.03
        sigma_ba: 0.1
        a_max: 176.0
        g_max: 7.8
        a0: [0.0, 0.0, 0.0]
        tau: 3600.0
    Evaluation:
      estimate_frame: body
NumRuns: 1
Evaluation:
  align: origin
  correct_scale: false
  max_time_difference_s: 0.05
  evaluate_orientation: true
  max_pose_gap_s: 1.0
  rpe_delta_m: 1.0
  rpe_relative_tolerance: 0.1
