# GEODE Offroad1: original pixel geometry and published radtan5 calibration.
# OKVIS adapter represents D5 exactly as D8=[k1,k2,p1,p2,k3,0,0,0].
Datasets:
  geode-gamma:
  - offroad1_raw_radtan5
Methods:
  orbslam3_stereo_vi:
    Module: orbslam3
    Parameters:
      mode: stereo-vi
      verbose: 0
      imu_noise_by_dataset: &id001
        geode-gamma:
          sigma_g_c: 0.005144105954181043
          sigma_a_c: 0.0055741025513357766
          sigma_gw_c: 0.00010881627554710405
          sigma_aw_c: 0.00012078671772058479
    Settings:
      loopClosing: 0
    Evaluation:
      estimate_frame: camera
      camera: rgb_0
  okvis1_stereo_vi:
    Module: okvis1
    Parameters:
      mode: stereo-vi
      verbose: 0
      imu_noise_by_dataset: *id001
      imu_overrides:
        sigma_bg: 0.03
        sigma_ba: 0.1
        a_max: 176.0
        g_max: 7.8
        a0:
        - 0.0
        - 0.0
        - 0.0
        tau: 3600.0
    Evaluation:
      estimate_frame: body
NumRuns: 1
Evaluation:
  align: SE3
  correct_scale: false
  max_time_difference_s: 0.05
  evaluate_orientation: true
  max_pose_gap_s: 1.0
  rpe_delta_m: 1.0
  rpe_relative_tolerance: 0.1
