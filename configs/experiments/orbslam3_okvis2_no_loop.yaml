# ORB mono/stereo + OKVIS2 mono, loop closures disabled in all variants.
# OKVIS2 nested settings replace the entire stock section.
Datasets:
  grandtour-alphasense:
  - kaeb_1
  botanicgarden:
  - '1018_00'
Methods:
  orbslam3_mono_no_loop:
    Module: orbslam3
    Parameters:
      mode: mono-vi
      verbose: 0
      # Same effective IMU noise for both methods, frozen per native recipe.
      imu_noise_by_dataset: &imu_noise_profiles
        # GrandTour: published Allan variance, measured Alphasense noise.
        # grand_tour_box @ 7c7b7884e06a2082ac11f7b8a2ef3b7d25de5062
        # box_calibration/box_calibration/calibration/allan_variances/alphasense/imu.yaml
        grandtour-alphasense:
          sigma_g_c: 0.00020202932517334086
          sigma_a_c: 0.0012593921763625943
          sigma_gw_c: 0.0000018672379701877664
          sigma_aw_c: 0.00004317454918100831
        # BotanicGarden: author's tested ORB-SLAM3 noise profile, not stationary noise.
        # BotanicGarden @ 84c4806428ca16c154238e263a7f8bf828bf58e1
        # config/ORB-SLAM3/dalsa_gray_down_stereo_xsens.yaml
        botanicgarden:
          sigma_g_c: 0.002
          sigma_a_c: 0.01
          sigma_gw_c: 0.00008
          sigma_aw_c: 0.00003
    Settings:
      loopClosing: 0
    Evaluation:
      estimate_frame: camera
      camera: rgb_0
  orbslam3_stereo_no_loop:
    Module: orbslam3
    Parameters:
      mode: stereo-vi
      verbose: 0
      imu_noise_by_dataset: *imu_noise_profiles
    Settings:
      loopClosing: 0
    Evaluation:
      estimate_frame: camera
      camera: rgb_0
  okvis2_no_loop:
    Module: okvis2
    Parameters:
      mode: mono-vi
      verbose: 0
      imu_noise_by_dataset: *imu_noise_profiles
      # Estimator priors/limits from stock OKVIS settings; not sensor noise.
      # Applied only to the per-run calibration copy. Initial biases are zero.
      imu_overrides:
        sigma_bg: 0.01
        sigma_ba: 0.1
        a_max: 176.0
        g_max: 7.8
        a0: [0.0, 0.0, 0.0]
        g0: [0.0, 0.0, 0.0]
    Settings:
      estimator_parameters:
        num_keyframes: 5
        num_loop_closure_frames: 3
        num_imu_frames: 3
        do_loop_closures: false
        do_final_ba: false
        enforce_realtime: false
        realtime_min_iterations: 3
        realtime_max_iterations: 10
        realtime_time_limit: 0.035
        realtime_num_threads: 3
        full_graph_iterations: 15
        full_graph_num_threads: 3
        p_dbow: 0.4
        drift_percentage_heuristic: 1.35
    Evaluation:
      estimate_frame: body
NumRuns: 1
Evaluation:
  align: origin
  correct_scale: false
  max_time_difference_s: 0.05
  evaluate_orientation: true
  max_pose_gap_s: 1.0
  rpe_delta_m: 1.0
  rpe_relative_tolerance: 0.1
