orbslam3_stereo_vi_grandtour_alb_1_no_loop:
  Config: configs/experiments/grandtour_alb_1_sequences.yaml
  ResultsDir: ${VIO_RESULTS_DIR}
  MethodSettings: configs/methods/orbslam3_stereo_vi.yaml
  NumRuns: 1
  Module: orbslam3
  Parameters:
    verbose: 0
    mode: stereo-vi
  Evaluation:
    align: SE3
    correct_scale: false
    max_time_difference_s: 0.01
    estimate_frame: camera
    camera: rgb_0
    evaluate_orientation: true
    max_pose_gap_s: 1.0
    rpe_delta_m: 1.0
    rpe_relative_tolerance: 0.1
  Preparation:
    reserve_gb: 15
    max_data_gb: 125
