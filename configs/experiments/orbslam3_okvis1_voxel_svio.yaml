# Stereo-inertial VIO: same camera/IMU interval and noise profiles; no loop closure.
# BotanicGarden 1018_13 starts at the audited camera/IMU interval, without FrameStart.
Datasets:
  grandtour-alphasense:
  - kaeb_1
  botanicgarden:
  - '1018_13'
Methods:
  orbslam3_stereo_vi:
    Module: orbslam3
    Parameters:
      mode: stereo-vi
      verbose: 0
      imu_noise_by_dataset: &id001
        grandtour-alphasense:
          sigma_g_c: 0.00020202932517334086
          sigma_a_c: 0.0012593921763625943
          sigma_gw_c: 1.8672379701877664e-06
          sigma_aw_c: 4.317454918100831e-05
        botanicgarden:
          sigma_g_c: 0.002
          sigma_a_c: 0.01
          sigma_gw_c: 8.0e-05
          sigma_aw_c: 3.0e-05
    Settings:
      loopClosing: 0
    Evaluation:
      estimate_frame: camera
      camera: rgb_0
  okvis1_stereo_vi:
    Module: okvis1
    Parameters:
      mode: stereo-vi
      verbose: 0
      imu_noise_by_dataset: *id001
      imu_overrides:
        sigma_bg: 0.03
        sigma_ba: 0.1
        a_max: 176.0
        g_max: 7.8
        a0:
        - 0.0
        - 0.0
        - 0.0
        tau: 3600.0
    Evaluation:
      estimate_frame: body
  voxel_svio_stereo_vi:
    Module: voxel-svio
    Parameters:
      mode: stereo-vi
      verbose: 0
      imu_noise_by_dataset: *id001
    Evaluation:
      estimate_frame: body
NumRuns: 1
Evaluation:
  align: origin
  correct_scale: false
  max_time_difference_s: 0.05
  evaluate_orientation: true
  max_pose_gap_s: 1.0
  rpe_delta_m: 1.0
  rpe_relative_tolerance: 0.1
